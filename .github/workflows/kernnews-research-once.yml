name: Kernnews research once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernnews-research-once.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch structured discovery sources
        shell: bash
        run: |
          python3 - <<'PY' > .research-output-3.txt
          import urllib.request, urllib.parse, json, time
          UA={'User-Agent':'Mozilla/5.0 (compatible; KernnewsResearch/1.0)'}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
          urls=[
            ('empire','https://api.empireflippers.com/api/v1/listings/list?listing_status=For%20Sale&sort=first_listed_at&order=DESC&limit=100&page=1'),
            ('hn-top','https://hacker-news.firebaseio.com/v0/topstories.json'),
            ('hn-new','https://hacker-news.firebaseio.com/v0/newstories.json'),
            ('hn-best','https://hacker-news.firebaseio.com/v0/beststories.json')]
          for name,url in urls:
              print('\n===',name,url,'===')
              try: print(get(url)[:200000])
              except Exception as e: print('ERROR',repr(e))
              time.sleep(1.1)
          PY
      - name: Commit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .research-output-3.txt
          git commit -m 'Add temporary structured source checks' || exit 0
          git push
