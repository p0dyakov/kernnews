name: Kernnews research once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernnews-research-once.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live fetch
        shell: bash
        run: |
          python3 - <<'PY' > .research-output.txt
          import json, urllib.request, urllib.parse, re, html, time
          UA={'User-Agent':'Mozilla/5.0 (compatible; KernnewsResearch/1.0)'}
          def get(url):
              req=urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.headers.get('content-type',''), r.read().decode('utf-8','replace')
          def textify(raw):
              raw=re.sub(r'<script[\s\S]*?</script>',' ',raw,flags=re.I)
              raw=re.sub(r'<style[\s\S]*?</style>',' ',raw,flags=re.I)
              s=re.sub(r'<[^>]+>','\n',raw)
              s=html.unescape(s)
              return '\n'.join(x.strip() for x in s.splitlines() if x.strip())
          start=1786952130; end=1787040857
          print('=== HN LIVE ===')
          params=urllib.parse.urlencode({'tags':'story','numericFilters':f'created_at_i>{start},created_at_i<{end}','hitsPerPage':'1000'})
          _,_,raw=get('https://hn.algolia.com/api/v1/search_by_date?'+params)
          hits=json.loads(raw).get('hits',[])
          hits=[h for h in hits if (h.get('points') or 0)>=30]
          hits.sort(key=lambda h:h.get('points') or 0, reverse=True)
          for h in hits[:100]:
              print(json.dumps({'id':h.get('objectID'),'created_at':h.get('created_at'),'points':h.get('points'),'comments':h.get('num_comments'),'title':h.get('title'),'url':h.get('url'),'hn':'https://news.ycombinator.com/item?id='+str(h.get('objectID'))},ensure_ascii=False))
          print('\n=== SOURCE CHECKS ===')
          urls={
            'producthunt':'https://www.producthunt.com/leaderboard/daily/2026/8/17/all',
            'kickstarter':'https://www.kickstarter.com/discover/newest',
            'backerkit':'https://www.backerkit.com/c/feeds/just_launched/projects',
            'wefunder':'https://wefunder.com/explore/marketplace',
            'republic':'https://republic.com/companies',
            'springwise':'https://springwise.com/home/',
            'starterstory':'https://www.starterstory.com/episodes',
            'empire':'https://api.empireflippers.com/api/v1/listings/list?listing_status=For%20Sale&sort=first_listed_at&order=DESC&limit=20&page=1'}
          for name,url in urls.items():
              print('\n---',name,url)
              try:
                  st,ct,raw=get(url); print('STATUS',st,'TYPE',ct,'BYTES',len(raw))
                  print((raw if ('json' in ct or name=='empire') else textify(raw))[:12000])
              except Exception as e: print('ERROR',repr(e))
              time.sleep(1.1)
          PY
      - name: Commit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .research-output.txt
          git commit -m 'Add temporary Kernnews research output' || exit 0
          git push
