name: Publish digest to Telegram

on:
  push:
    branches:
      - main
    paths:
      - '*.md'
  workflow_dispatch:
    inputs:
      file:
        description: 'Root dated Markdown file; latest is used when empty'
        required: false
        type: string
      message_id:
        description: 'Existing Telegram message_id to bind and edit'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: kernnews-telegram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select dated Markdown files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            requested="${{ inputs.file }}"
            if [[ -z "$requested" ]]; then
              requested="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -printf '%f\n' \
                | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
                | sort | tail -n 1 || true)"
            fi
            if [[ -n "$requested" && ! "$requested" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$ ]]; then
              echo "Manual file must match YYYY-MM-DD.md" >&2
              exit 1
            fi
            records=""
            if [[ -n "$requested" ]]; then
              records="MANUAL"$'\t'"$requested"
            fi
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" =~ ^0+$ ]]; then
              changed="$(git show --pretty='' --name-status "$after")"
            else
              changed="$(git diff --name-status "$before" "$after")"
            fi
            records="$(printf '%s\n' "$changed" \
              | awk '$1 == "A" || $1 == "M" { print $1 "\t" $2 }' \
              | grep -E $'^(A|M)\t[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
              || true)"
          fi

          {
            echo 'records<<EOF'
            printf '%s\n' "$records"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Render and publish/edit Telegram post
        if: steps.files.outputs.records != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@kernnews'
          RECORDS: ${{ steps.files.outputs.records }}
          MANUAL_MESSAGE_ID: ${{ inputs.message_id }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          workspace = os.environ['GITHUB_WORKSPACE']
          manual_message_id = os.environ.get('MANUAL_MESSAGE_ID', '').strip()
          records = []
          for row in os.environ.get('RECORDS', '').splitlines():
              if not row.strip():
                  continue
              status, filename = row.split('\t', 1)
              records.append((status.strip(), filename.strip()))

          if not token:
              raise SystemExit('TELEGRAM_BOT_TOKEN secret is not configured')
          if not chat_id:
              raise SystemExit('TELEGRAM_CHAT_ID is not configured')
          if manual_message_id and len(records) != 1:
              raise SystemExit('message_id can only be supplied for one manually selected file')
          if manual_message_id and not manual_message_id.isdigit():
              raise SystemExit('message_id must be numeric')

          state_path = os.path.join(workspace, '.telegram-state.json')
          try:
              with open(state_path, 'r', encoding='utf-8') as f:
                  state = json.load(f)
          except FileNotFoundError:
              state = {}
          if not isinstance(state, dict):
              raise SystemExit('.telegram-state.json must contain a JSON object')

          inline_token = re.compile(r'(\*\*[^*]+\*\*|\[[^\]]+\]\([^)]+\)|_[^_]+_)')
          comment_header = re.compile(r'^\*\*\[([^\]]+)\]\(([^)]+)\)\*\*$')

          def render_inline(text: str) -> str:
              out = []
              pos = 0
              for match in inline_token.finditer(text):
                  out.append(html.escape(text[pos:match.start()], quote=False))
                  value = match.group(0)
                  if value.startswith('**'):
                      out.append('<b>' + html.escape(value[2:-2], quote=False) + '</b>')
                  elif value.startswith('['):
                      m = re.fullmatch(r'\[([^\]]+)\]\(([^)]+)\)', value)
                      if m:
                          label, url = m.groups()
                          out.append('<a href="' + html.escape(url, quote=True) + '">' + html.escape(label, quote=False) + '</a>')
                      else:
                          out.append(html.escape(value, quote=False))
                  elif value.startswith('_'):
                      out.append('<i>' + html.escape(value[1:-1], quote=False) + '</i>')
                  pos = match.end()
              out.append(html.escape(text[pos:], quote=False))
              return ''.join(out)

          def render_comment(lines):
              if not lines:
                  return ''
              first = lines[0].strip()
              body_lines = [x.strip() for x in lines[1:] if x.strip()]
              m = comment_header.fullmatch(first)
              if m:
                  label, url = m.groups()
                  head = '<b><a href="' + html.escape(url, quote=True) + '">' + html.escape(label, quote=False) + '</a>:</b>'
              else:
                  head = '<b>Комментарии:</b>'
                  body_lines.insert(0, first)
              body = ' '.join(render_inline(x) for x in body_lines)
              return head + ((' ' + body) if body else '')

          def render_markdown(markdown: str) -> str:
              lines = markdown.splitlines()
              blocks = []
              i = 0
              while i < len(lines):
                  line = lines[i].rstrip()
                  if not line.strip():
                      i += 1
                      continue
                  if line.startswith('# '):
                      raise SystemExit('Digest must not contain a date/title # heading; date belongs only in filename')
                  if line.startswith('> '):
                      quote_lines = []
                      while i < len(lines) and lines[i].startswith('> '):
                          quote_lines.append(lines[i][2:])
                          i += 1
                      comment = render_comment(quote_lines)
                      if comment:
                          blocks.append(('comment', comment))
                      continue
                  if line.startswith('## '):
                      blocks.append(('section', '<b>' + render_inline(line[3:]) + '</b>'))
                  elif line.startswith('### '):
                      blocks.append(('item', '<b>' + render_inline(line[4:]) + '</b>'))
                  elif line.startswith('- '):
                      blocks.append(('text', render_inline('— ' + line[2:])))
                  elif line.startswith('Ничего нового:'):
                      blocks.append(('empty_summary', render_inline(line)))
                  else:
                      blocks.append(('text', render_inline(line)))
                  i += 1

              parts = []
              for kind, text in blocks:
                  if not parts:
                      sep = ''
                  elif kind in ('section', 'empty_summary'):
                      sep = '\n\n'
                  else:
                      sep = '\n'
                  parts.append(sep + text)
              return ''.join(parts).strip()

          def parsed_length(rendered: str) -> int:
              plain = re.sub(r'<[^>]+>', '', rendered)
              return len(html.unescape(plain))

          def telegram(method: str, payload: dict):
              request = urllib.request.Request(
                  f'https://api.telegram.org/bot{token}/{method}',
                  data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  error_text = exc.read().decode('utf-8', errors='replace')
                  try:
                      body = json.loads(error_text)
                  except Exception:
                      body = {'description': error_text}
                  if method == 'editMessageText' and 'message is not modified' in body.get('description', '').lower():
                      return {'ok': True, 'result': {'message_id': payload['message_id']}, 'not_modified': True}
                  print(error_text, file=sys.stderr)
                  raise SystemExit(f'Telegram API returned HTTP {exc.code}')

          state_changed = False
          for status, filename in records:
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}\.md', filename):
                  raise SystemExit(f'Refusing non-dated Markdown file: {filename}')
              path = os.path.join(workspace, filename)
              if not os.path.isfile(path):
                  raise SystemExit(f'File does not exist: {path}')

              with open(path, 'r', encoding='utf-8') as f:
                  rendered = render_markdown(f.read())
              length = parsed_length(rendered)
              if length > 4000:
                  raise SystemExit(f'Rendered Telegram post is {length} characters; keep it under 4000')

              if manual_message_id:
                  state[filename] = int(manual_message_id)
                  state_changed = True

              message_id = state.get(filename)
              base_payload = {
                  'chat_id': chat_id,
                  'text': rendered,
                  'parse_mode': 'HTML',
                  'link_preview_options': {'is_disabled': True},
              }

              if message_id is not None:
                  payload = dict(base_payload)
                  payload['message_id'] = int(message_id)
                  body = telegram('editMessageText', payload)
                  if not body.get('ok'):
                      raise SystemExit('Telegram editMessageText returned ok=false')
                  print(f'Edited existing Telegram post {message_id} for {filename} ({length} characters)')
              else:
                  if status != 'A':
                      raise SystemExit(
                          f'No stored Telegram message_id for existing {filename}. Refusing to send a duplicate. '
                          'Run workflow_dispatch once with the existing message_id.'
                      )
                  body = telegram('sendMessage', base_payload)
                  if not body.get('ok'):
                      raise SystemExit('Telegram sendMessage returned ok=false')
                  message_id = int(body['result']['message_id'])
                  state[filename] = message_id
                  state_changed = True
                  print(f'Created Telegram post {message_id} for new {filename} ({length} characters)')

          if state_changed:
              with open(state_path, 'w', encoding='utf-8') as f:
                  json.dump(state, f, ensure_ascii=False, indent=2, sort_keys=True)
                  f.write('\n')
          PY

      - name: Persist Telegram message IDs
        if: steps.files.outputs.records != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- .telegram-state.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .telegram-state.json
            git commit -m 'Track Telegram digest message IDs'
            git push
          fi
