name: Activate business sources once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-business-sources-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update INSTRUCTIONS
        shell: python
        run: |
          from pathlib import Path
          p = Path('INSTRUCTIONS.md')
          s = p.read_text(encoding='utf-8')
          old = '''Основные discovery-источники:\n\n- Kickstarter — `Just Launched` / новые проекты;\n- BackerKit — `Recently Launched`, в том числе для дополнительной проверки crowdfunding traction;\n- Wefunder — `Newest` / `New This Week`;\n- Republic — новые публичные кампании;\n- Springwise — latest innovations;\n- Empire Flippers — новые marketplace listings; новые бизнесы обычно выходят еженедельно;\n- Starter Story — свежие сильные case studies с экономикой бизнеса.\n\nИспользовать эти сайты как discovery, а не как автоматический whitelist. При необходимости искать дополнительные источники по всему интернету.\n'''
          new = '''### Обязательные discovery-источники\n\nНа **каждом ежедневном запуске обязательно проверить все источники ниже**, даже если сильные кандидаты уже найдены на первых сайтах. Только после полного обхода объединить кандидатов, дедуплицировать и выбрать лучшие.\n\n- Kickstarter — https://www.kickstarter.com/discover/advanced?sort=newest — новые проекты / `Just Launched`;\n- BackerKit — https://www.backerkit.com/c/feeds/all_time/projects?sort_by=recently_launched — `Recently Launched`, в том числе для дополнительной проверки crowdfunding traction;\n- Wefunder — https://wefunder.com/explore — `Newest` / `New This Week`;\n- Republic — https://republic.com/companies — новые публичные кампании;\n- Springwise — https://springwise.com/ — latest innovations и новые бизнес-модели из разных отраслей;\n- Empire Flippers — https://empireflippers.com/marketplace/ — новые marketplace listings и реальные operating businesses;\n- Starter Story — https://www.starterstory.com/ — свежие сильные case studies с экономикой бизнеса.\n\nИспользовать эти сайты как discovery, а не как автоматический whitelist. При необходимости искать дополнительные источники по всему интернету. Не прекращать обход из-за лимита места в отчёте: лимит применяется только на этапе финального отбора.\n'''
          if old not in s:
              raise SystemExit('Expected business sources block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add INSTRUCTIONS.md
          git rm .github/workflows/activate-business-sources-once.yml
          git commit -m 'Require all business discovery sources'
          git push
