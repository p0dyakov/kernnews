name: Add author sources once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-authors-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add authors and clean up
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('INSTRUCTIONS.md')
          text = path.read_text(encoding='utf-8')
          anchor = '— Eugene Yan — https://eugeneyan.com/writing/\n'
          addition = (
              anchor
              + '— Ben Kuhn — https://www.benkuhn.net/posts/\n'
              + '— Morgan Housel — https://collabfund.com/blog/authors/morgan/\n'
          )
          if 'https://www.benkuhn.net/posts/' not in text:
              if anchor not in text:
                  raise SystemExit('Author anchor not found')
              text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-authors-once.yml
          git add INSTRUCTIONS.md
          git commit -m 'Add Ben Kuhn and Morgan Housel sources'
          git push
