name: Fix migration section v2 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-migration-section-v2-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace migration section
        env:
          REPLACEMENT_B64: 
        run: |
          python3 -c "import os,base64,re,pathlib; p=pathlib.Path('INSTRUCTIONS.md'); s=p.read_text(encoding='utf-8'); r=base64.b64decode(os.environ['REPLACEMENT_B64']).decode(); s2,n=re.subn(r'## 15\\. Как полностью настроить систему на новом ChatGPT-аккаунте\\n.*?(?=## 16\\. Правило изменения системы)',r,s,flags=re.S); assert n==1, n; p.write_text(s2,encoding='utf-8')"
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add INSTRUCTIONS.md
          git rm -f .github/workflows/fix-migration-section-v2-once.yml
          git rm -f .github/workflows/fix-migration-section-once.yml || true
          git rm -f .github/workflows/simplify-migration-once.yml || true
          git commit -m 'Simplify ChatGPT account migration setup'
          git push
