name: Research 2026-08-19
on:
  push:
    paths:
      - '.github/workflows/research-2026-08-19.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live research endpoints
        shell: bash
        run: |
          python3 - <<'PY' > _research-2026-08-19.txt
          import json, urllib.request, urllib.parse, time, re
          UA={'User-Agent':'Mozilla/5.0 KernnewsResearch/1.0'}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8','replace')
          start=1787040900
          end=int(time.time())
          print('WINDOW',start,end)
          ids=[]
          for ep in ('topstories','newstories','beststories'):
              try:
                  arr=json.loads(get(f'https://hacker-news.firebaseio.com/v0/{ep}.json'))
                  ids.extend(arr)
              except Exception as e: print('HN_LIST_ERR',ep,repr(e))
          seen=set(); stories=[]
          for i in ids:
              if i in seen: continue
              seen.add(i)
              try: h=json.loads(get(f'https://hacker-news.firebaseio.com/v0/item/{i}.json'))
              except Exception: continue
              if h and h.get('type')=='story' and start < int(h.get('time',0)) <= end and int(h.get('score',0))>=20:
                  stories.append({k:h.get(k) for k in ('id','time','score','descendants','title','url','by')})
          stories.sort(key=lambda x:x.get('score') or 0, reverse=True)
          print('\n=== HN WINDOW >=20 ===')
          for h in stories: print(json.dumps(h,ensure_ascii=False))
          print('\n=== EMPIRE FLIPPERS API ===')
          qs=urllib.parse.urlencode({'listing_status':'For Sale','sort':'first_listed_at','order':'DESC','limit':100,'page':1})
          try:
              raw=get('https://api.empireflippers.com/api/v1/listings/list?'+qs)
              print(raw[:70000])
          except Exception as e: print('EMPIRE_ERR',repr(e))
          for name,url in [
              ('WEFUNDER','https://wefunder.com/explore/marketplace'),
              ('WEFUNDER_ALL','https://wefunder.com/explore/all'),
              ('BACKERKIT','https://www.backerkit.com/c/feeds/just_launched/projects'),
              ('BACKERKIT_RECENT','https://www.backerkit.com/c/feeds/all_time/projects?sort_by=recently_launched'),
              ('PH','https://www.producthunt.com/leaderboard/daily/2026/8/18/all')]:
              print(f'\n=== {name} ===')
              try:
                  raw=get(url)
                  txt=re.sub(r'<script[\s\S]*?</script>',' ',raw,flags=re.I)
                  txt=re.sub(r'<style[\s\S]*?</style>',' ',txt,flags=re.I)
                  txt=re.sub(r'<[^>]+>','\n',txt)
                  txt='\n'.join(x.strip() for x in txt.splitlines() if x.strip())
                  print(txt[:30000])
              except Exception as e: print(name+'_ERR',repr(e))
          PY
      - name: Commit research output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _research-2026-08-19.txt
          git commit -m 'Persist one-time research results'
          git push
