name: Live research once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-research-once.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch HN and Product Hunt
        shell: python
        run: |
          import json, urllib.request, urllib.parse, re, html

          ua = {'User-Agent': 'Mozilla/5.0 KernnewsResearch/1.0'}

          def get(url):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8', 'replace')

          start=1786848641
          end=1786962780
          params=urllib.parse.urlencode({
              'tags':'story',
              'numericFilters':f'created_at_i>{start},created_at_i<{end}',
              'hitsPerPage':'1000'
          })
          hn_url='https://hn.algolia.com/api/v1/search_by_date?'+params
          data=json.loads(get(hn_url))
          hits=[h for h in data.get('hits',[]) if (h.get('points') or 0)>=30]
          hits.sort(key=lambda h:(h.get('points') or 0), reverse=True)
          print('=== HN STORIES >=30 POINTS IN WINDOW ===')
          for h in hits[:120]:
              print(json.dumps({
                  'id':h.get('objectID'),'created_at':h.get('created_at'),'points':h.get('points'),
                  'comments':h.get('num_comments'),'title':h.get('title'),'url':h.get('url'),
                  'hn':'https://news.ycombinator.com/item?id='+str(h.get('objectID'))
              }, ensure_ascii=False))

          print('\n=== PRODUCT HUNT 2026-08-16 TEXT ===')
          try:
              raw=get('https://www.producthunt.com/leaderboard/daily/2026/8/16')
              raw=re.sub(r'<script[\s\S]*?</script>', ' ', raw, flags=re.I)
              raw=re.sub(r'<style[\s\S]*?</style>', ' ', raw, flags=re.I)
              txt=re.sub(r'<[^>]+>', '\n', raw)
              txt=html.unescape(txt)
              txt='\n'.join(line.strip() for line in txt.splitlines() if line.strip())
              print(txt[:30000])
          except Exception as e:
              print('PH_ERROR', repr(e))
